version: "3.0"

server:
  rest_port: 8083
  grpc_port: 9093
  workers: 4

noise:
  default_sigma: 0.01
  preserve_norm: true
  strategy: gaussian
  tenant_overrides:
    tenant-acme: 0.015
    tenant-public: 0.005

bias:
  enabled: true
  medium_threshold: 0.15
  high_threshold: 0.25
  dims: 1024

quality:
  enabled: true
  recall_drop_alert: 20.0
  similarity_minimum: 0.95

events:
  nats_url: nats://nats:4222
  enabled: true
